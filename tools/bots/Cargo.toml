# STARFALL DYNASTY — QA 봇 하네스 (p0-02-networking-spike T12)
#
# 레포 루트 `rust-toolchain.toml`(1.98.1)을 상속한다. 그 파일은 고치지 않는다.
# server/ 워크스페이스와 분리된 별도 워크스페이스다 — 서버 빌드 게이트(clippy -D warnings)에
# QA 도구가 섞이지 않게 하고, 서버가 바뀌는 동안에도 봇이 독립적으로 빌드되게 한다.
[workspace]
members = ["."]

[package]
name = "starfall-bots"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "LicenseRef-Proprietary"
publish = false

[[bin]]
name = "bots"
path = "src/main.rs"

[dependencies]
# 버전은 server 워크스페이스와 같은 값을 쓴다(캐시 공유 + 동작 차이 제거).
tokio = { version = "1.53.1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "io-util",
] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = [
    "connect",
    "handshake",
] }
futures-util = { version = "0.3.34", default-features = false, features = [
    "std",
    "sink",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", default-features = false, features = [
    "std",
    "v7",
    "serde",
] }
# ADR-0008 §1의 개발용 토큰. server 는 sqlx-postgres 가 이미 가진 것을 쓰지만,
# 봇은 별도 워크스페이스라 직접 의존한다(서버 의존 트리에는 영향이 없다).
hmac = "0.12.1"
sha2 = "0.10.9"
hex = "0.4.3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"
