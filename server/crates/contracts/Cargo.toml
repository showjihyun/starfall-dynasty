[package]
name = "starfall-contracts"
description = "contracts/ 에 대응하는 serde 타입과 레지스트리 주도 계약 테스트."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
# `v5` 는 이 크레이트만 더한다 — `UuidV5`(p1-02, 역사 이벤트 id)가 여기 산다.
# `starfall-sim`/`starfall-history` 는 v5 를 켜지 않는다(SC-02·SC-03의 금지 목록에는
# uuid 자체가 없으므로 이 추가는 그 검사에 걸리지 않는다).
uuid = { workspace = true, features = ["v5"] }

[dev-dependencies]
jsonschema.workspace = true
serde_json.workspace = true
