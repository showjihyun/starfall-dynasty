[package]
name = "starfall-history"
description = "역사 판정 코어 — Domain Event → Historical Event, 순수·결정적 (ADR-0014 §1)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
# [workspace.lints] 는 멤버가 이 줄로 옵트인해야 적용된다.
workspace = true

[dependencies]
starfall-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
# UUIDv5(이름 기반) 는 이 크레이트만 쓴다 — Historical Event id 를 고정 입력에서
# 재현 가능하게 만드는 데 필요하다(H1, AC-10). 워크스페이스 기본은 v7 뿐이라
# feature 를 여기서만 더한다(SC-02: sim/history 의 [dependencies] 에 axum/sqlx/redis/
# rand/chrono/tokio 가 없다 — uuid 는 그 목록에 없으므로 이 추가는 그 금지에 걸리지 않는다).
uuid = { workspace = true, features = ["v5"] }
thiserror.workspace = true

[dev-dependencies]
# golden 테스트(SC-50)의 규칙 파일 정규화 해시 전용. 프로덕션 코드 경로에는 없다 —
# 코어는 파일을 읽지 않는다(ADR-0014 §5).
sha2.workspace = true
