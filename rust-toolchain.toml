# STARFALL DYNASTY — Rust 툴체인 고정 (ADR-0003 §1)
#
# 레포 루트에 둔다. rustup은 현재 디렉토리부터 상위로 올라가며 이 파일을 찾으므로
# server/ 워크스페이스와 (나중에 생길) tools/bots/ 워크스페이스가 같은 버전을 상속한다.
# 두 파일이 어긋나는 사고를 구조적으로 막는다 (ADR-0001 §4).
#
# channel을 "stable"로 두지 않는 이유: stable은 6주마다 바뀌고, 새 clippy 린트가
# `-D warnings` 게이트를 기능과 무관한 이유로 실패시킨다. 툴체인 상승은 의도된 작업으로 만든다.
# 올릴 때는 ADR-0003을 함께 갱신한다.
#
# 주의: 이 PC에 설치된 툴체인은 `stable-x86_64-pc-windows-msvc` 하나뿐이다.
# 버전이 같아도 rustup에게 "1.98.1"은 다른 툴체인 이름이므로,
# 레포 안 첫 cargo 실행이 1.98.1-x86_64-pc-windows-msvc를 새로 내려받는다(1회).

[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
