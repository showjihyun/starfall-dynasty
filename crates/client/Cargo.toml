[package]
name = "client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = { version = "0.20", features = ["wav"] }
bevy_egui = "0.43"
shared = { path = "../shared" }
view = { path = "../view" }
# Replays run the recorded simulation in-process (`--replay`); the library only, no network stack.
sim = { path = "../sim" }
# The bench battle (src/battle.rs) builds its own Game, which needs the chronicle engine.
history = { path = "../history" }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
crossbeam-channel = { workspace = true }

[features]
# Experimental ray-traced lighting (src/raytracing.rs): Vulkan only, run with STARFALL_RT=1.
raytracing = ["bevy/bevy_solari"]
# + DLSS Ray Reconstruction denoiser: needs DLSS_SDK, VULKAN_SDK and clang at build time.
raytracing_dlss = ["raytracing", "bevy/dlss"]
# Tracy profiler zones for every engine and game system (tools/tracy.py captures a run headless).
profile = ["bevy/trace_tracy"]
